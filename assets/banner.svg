<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" fill-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .orb-left {
      transform-origin: 200px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-right {
      transform-origin: 1000px 320px;
      animation: pulseOrb 7s ease-in-out infinite 1s;
    }
    .stream-line {
      stroke-dasharray: 20, 10;
      animation: dataStream 15s linear infinite;
    }
    .floating-box-1 {
      animation: floatNode 6s ease-in-out infinite;
    }
    .floating-box-2 {
      animation: floatNode 6s ease-in-out infinite 2s;
    }
    .floating-box-3 {
      animation: floatNode 6s ease-in-out infinite 4s;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Placed strictly in background) -->
  <g class="orb-left">
    <circle cx="200" cy="100" r="180" fill="#38bdf8" filter="url(#glow)" />
  </g>
  <g class="orb-right">
    <circle cx="1000" cy="320" r="220" fill="#818cf8" filter="url(#glow)" />
  </g>

  <!-- Decorative Circuit / Architectural Connection Lines in Background -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 H 350 L 450 180 V 360 H 800" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />
    <path class="stream-line" d="M 1150 340 H 850 L 750 240 V 60 H 400" fill="none" stroke="url(#cyanLine)" stroke-width="2" />
    <circle cx="350" cy="80" r="4" fill="#38bdf8" />
    <circle cx="450" cy="180" r="4" fill="#818cf8" />
    <circle cx="850" cy="340" r="4" fill="#c084fc" />
    <circle cx="750" cy="240" r="4" fill="#38bdf8" />
  </g>

  <!-- Ambient Dynamic Architecture Model Cards in Left & Right Margins (Kept away from center text) -->
  <g class="floating-box-1" opacity="0.75">
    <rect x="40" y="220" width="170" height="70" rx="8" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="55" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">SYSTEM CONTEXT</text>
    <text x="55" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">&lt;C4 Level 1: Scope&gt;</text>
  </g>

  <g class="floating-box-2" opacity="0.75">
    <rect x="990" y="80" width="170" height="70" rx="8" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="1005" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#a5b4fc">CONTAINER / DSL</text>
    <text x="1005" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Structurizr &amp; LikeC4</text>
  </g>

  <g class="floating-box-3" opacity="0.75">
    <rect x="990" y="240" width="170" height="70" rx="8" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#softGlow)" />
    <text x="1005" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#e879f9">DECLARATIVE CODE</text>
    <text x="1005" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Git-native CI/CD specs</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) - Guaranteed Clear and Unobscured -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <rect x="470" y="45" width="260" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
    <circle cx="488" cy="61" r="5" fill="#38bdf8" />
    <text x="502" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">AWESOME REPOSITORY</text>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Architecture as Code
    </text>
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
      &amp; Modeling Tools Ecosystem
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="245" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Catalog of SaaS Platforms, C4 Model DSLs, Diagrams as Code &amp; Enterprise Modeling Suites
    </text>

    <!-- Feature Tags Row in Foreground -->
    <g transform="translate(230, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🏗️ C4 Model</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="227" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#818cf8">📜 Diagrams as Code</text>

      <!-- Tag 3 -->
      <rect x="325" y="0" width="185" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="417" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">🏢 Enterprise Arch (EA)</text>

      <!-- Tag 4 -->
      <rect x="525" y="0" width="215" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="632" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">⚡ Declarative DSLs &amp; CLI</text>
    </g>

    <!-- Bottom Accent Border Line -->
    <rect x="150" y="375" width="900" height="2" fill="url(#cyanLine)" />
  </g>
</svg>
